# Déploiement Fly.io : `fly launch --no-deploy`, puis `fly volumes create voiture_data --size 1`,
# `fly secrets set ANTHROPIC_API_KEY=... VOITURE_APP_TOKEN=...` et `fly deploy`.
app = "chasseur-voiture"
primary_region = "cdg"

[build]

[env]
  VOITURE_DATA_DIR = "/data"

[mounts]
  source = "voiture_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # La machine doit rester allumée pour chercher en arrière-plan.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
